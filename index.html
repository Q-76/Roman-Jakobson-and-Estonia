<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roman Jakobson and Estonia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a warm scholarly offprint. Sticky stepper bar; hero with thesis and ledger; aspects as an editorial index of lettered rows; each aspect a two-column dossier with a margin column; sources as catalogue slips. */
  --paper:#f7f1e7; --card:#fffaf1; --sunk:#efe6d7; --ink:#2b1f19; --muted:#7b6a5c; --rule:#e0d2be;
  --accent:#b24a0c; --accent-ink:#fff8ec; --accent-soft:#f7e4c6; --gold:#8a6a2a;
  --ok:#4c6a35; --ok-soft:#e6ecd6; --warn:#96600c; --warn-soft:#f8e8c6;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgba(43,31,25,.04),0 8px 24px -16px rgba(43,31,25,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1b1512; --card:#251d18; --sunk:#16110e; --ink:#f2e8da; --muted:#b3a292; --rule:#3a2e26;
    --accent:#f0a02e; --accent-ink:#241704; --accent-soft:#3b2a10; --gold:#c9a66a;
    --ok:#a9c78b; --ok-soft:#27311d; --warn:#e8bb62; --warn-soft:#3a2c12;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1512; --card:#251d18; --sunk:#16110e; --ink:#f2e8da; --muted:#b3a292; --rule:#3a2e26;
  --accent:#f0a02e; --accent-ink:#241704; --accent-soft:#3b2a10; --gold:#c9a66a;
  --ok:#a9c78b; --ok-soft:#27311d; --warn:#e8bb62; --warn-soft:#3a2c12;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono)}

/* bar */
header.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
header.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:17px;font-weight:500;letter-spacing:-.01em}
.brand .mark{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-style:italic;font-size:14px;font-weight:600}
nav.layers{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
nav.layers a{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;transition:background .15s,color .15s}
nav.layers a .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);font-family:var(--mono);font-size:11px;background:var(--card)}
nav.layers a:hover{color:var(--ink);background:var(--sunk)}
nav.layers a[aria-current="page"]{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--rule)}
nav.layers a[aria-current="page"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.layers .sep{width:14px;height:1px;background:var(--rule)}

main{display:flex;flex-direction:column;gap:64px;padding:48px 0 96px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,6.4vw,76px);line-height:1.0;letter-spacing:-.025em;margin:0;text-wrap:balance;font-variation-settings:"opsz" 144}
h1 em{font-style:italic;color:var(--accent);font-weight:300}
h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.4vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.sec-head h3{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.01em;margin:0}
.sec-head .aux{font-family:var(--mono);font-size:12px;color:var(--muted)}
section.block{display:flex;flex-direction:column;gap:22px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:48px;align-items:end}
.hero-text{display:flex;flex-direction:column;gap:22px}
.lede{max-width:58ch;font-size:18.5px;line-height:1.55;color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:9px 16px;background:transparent;transition:background .15s,color .15s}
a.btn:hover{background:var(--accent);color:var(--accent-ink)}
a.btn.solid{background:var(--accent);color:var(--accent-ink)}
a.btn.solid:hover{filter:brightness(1.1)}
.stats{margin:0;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.stats div{padding:18px 20px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stats div:nth-child(2n){border-right:0}
.stats div:nth-last-child(-n+2){border-bottom:0}
.stats dt{order:2;font-size:13px;color:var(--muted)}
.stats dd{order:1;margin:0;font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats div:first-child dd{color:var(--accent)}

/* timeline */
.tl-scroll{overflow-x:auto;padding-bottom:6px}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);min-width:max-content}
.timeline li{position:relative;padding:26px 18px 0 0}
.timeline li::before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;background:var(--rule)}
.timeline li::after{content:"";position:absolute;left:0;top:3px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.timeline li:last-child::after{background:var(--accent)}
.timeline a{display:flex;flex-direction:column;gap:4px;color:inherit;text-decoration:none;max-width:150px}
.timeline .yr{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500;white-space:nowrap}
.timeline .ev{font-size:13.5px;line-height:1.4;color:var(--ink)}
.timeline a:hover .ev{text-decoration:underline;text-underline-offset:3px}

/* aspect index */
.index{display:flex;flex-direction:column}
a.row{display:grid;grid-template-columns:72px minmax(0,1fr) 210px 28px;gap:24px;align-items:center;padding:24px 12px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;border-radius:10px;transition:background .15s}
a.row:hover{background:var(--card)}
a.row .letter{font-family:var(--display);font-style:italic;font-weight:300;font-size:60px;line-height:1;color:var(--accent);font-variation-settings:"opsz" 144}
a.row .main{display:flex;flex-direction:column;gap:6px;min-width:0}
a.row .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
a.row .ttl{font-family:var(--display);font-size:27px;line-height:1.15;letter-spacing:-.01em}
a.row .gl{font-size:15px;color:var(--muted);max-width:62ch}
a.row .meta{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:12px;color:var(--muted)}
a.row .meta b{font-weight:500;color:var(--ink)}
a.row .arrow{font-size:20px;color:var(--accent);transition:transform .15s}
a.row:hover .arrow{transform:translateX(4px)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.note{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px 22px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.note b{font-family:var(--display);font-size:18px;font-weight:500}
.note.plain{border-style:dashed}

/* dossier */
.back{font-size:13.5px;font-weight:500;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--accent)}
.dossier{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:56px;align-items:start}
.dossier .col{display:flex;flex-direction:column;gap:40px;min-width:0}
.dossier-head{display:flex;flex-direction:column;gap:16px}
.dossier-head .big{display:flex;align-items:flex-end;gap:20px}
.dossier-head .big .letter{font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(64px,9vw,112px);line-height:.8;color:var(--accent);font-variation-settings:"opsz" 144}
.prose{display:flex;flex-direction:column;gap:16px;max-width:64ch;font-size:17.5px;line-height:1.65}
.prose p:first-child::first-letter{font-family:var(--display);font-size:3.1em;line-height:.85;float:left;padding:6px 10px 0 0;color:var(--accent)}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.side .hd{padding:14px 18px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--rule)}
.side dl{margin:0;padding:6px 18px}
.side dl div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.side dl div:last-child{border-bottom:0}
.side dt{color:var(--muted)}
.side dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.side .acts{display:flex;flex-direction:column;gap:8px;padding:14px 18px 18px;background:var(--sunk);border-top:1px solid var(--rule)}
.side .acts a.btn{justify-content:center}

.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.facts li{padding:16px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:start}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;white-space:nowrap;justify-self:start}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.fact-text{font-size:15.5px;line-height:1.55}
.refs{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:8px;vertical-align:1px}
.ref{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);background:var(--card);color:var(--accent);border-radius:999px;padding:1px 8px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.ref:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* slips */
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.slip{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px 22px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:84px;transition:border-color .15s,box-shadow .15s}
.slip:hover{box-shadow:var(--shadow)}
.slip.hit{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slip .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slip .id{font-family:var(--mono);font-size:12px;color:var(--gold);margin-right:auto}
.tag{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.kind{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.kind.paid{background:var(--warn-soft);color:var(--warn)}
.slip .t{font-family:var(--display);font-size:20px;line-height:1.22;letter-spacing:-.005em;overflow-wrap:anywhere}
.slip .by{font-size:13.5px;color:var(--muted)}
.slip .what{font-size:14.5px;line-height:1.5}
.slip .go{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:10px}
.slip .go a.btn{padding:7px 14px;font-size:13px}
.slip .used{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.slip .used a{color:var(--muted)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pager a{display:flex;flex-direction:column;gap:4px;padding:18px 22px;border:1px solid var(--rule);border-radius:14px;text-decoration:none;color:var(--ink);background:var(--card);transition:border-color .15s}
.pager a:hover{border-color:var(--accent)}
.pager a small{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.pager a span{font-family:var(--display);font-size:20px}
.pager a.next{text-align:right}

/* library */
.controls{position:sticky;top:64px;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.controls label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.controls input,.controls select{font:inherit;font-size:14px;font-weight:400;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;min-width:150px}
.controls input{min-width:240px}
.count{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-left:auto;align-self:center}
.empty{grid-column:1/-1;padding:28px;border:1px dashed var(--rule);border-radius:14px;color:var(--muted);text-align:center}
footer{border-top:1px solid var(--rule);padding-top:20px;font-size:13px;color:var(--muted);max-width:80ch}

.byline{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 40px;padding-top:18px;border-top:1px solid var(--ink);font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.byline b{font-weight:500;color:var(--ink)}
main{padding-bottom:56px}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px;align-items:start}
  .dossier{grid-template-columns:1fr;gap:32px}
  .side{position:static;order:-1}
  .side .acts{flex-direction:row;flex-wrap:wrap}
  a.row{grid-template-columns:52px minmax(0,1fr) 24px;gap:16px}
  a.row .letter{font-size:44px}
  a.row .meta{grid-column:2;flex-direction:row;flex-wrap:wrap;gap:4px 14px}
  a.row .arrow{grid-column:3;grid-row:1}
  .controls{position:static}
}
@media (max-width:560px){
  .wrap{padding:0 18px}
  main{gap:44px;padding-top:32px}
  .facts li{grid-template-columns:1fr;gap:8px}
  .pager{grid-template-columns:1fr}
  .pager a.next{text-align:left}
  .controls input,.controls select{min-width:0;width:100%}
  .controls label{flex:1 1 100%}
  .slips{grid-template-columns:1fr}
  .brand{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 prose:["Pilshchikov and Trunin describe the transfer plainly: the idea of bringing structural linguistics and semiotics into literary study began in the Prague Linguistic Circle and reached Moscow and Tartu mainly through Jakobson, by reading and by personal contact. Lotman acknowledged the debt in print in the 1970s.",
 "The relationship was also a disagreement. Lotman took Jakobson's six-factor model of 1960 as the starting point and then revised it, arguing that communication needs at least two languages and that a culture also speaks to itself. Torop's work on autocommunication and the 2008 Tartu special issue on translation continue that argument.",
 "When Jakobson died, Keel ja Kirjandus asked Lotman for an obituary. He found he could not write it at once. The text he finished some months later calls Jakobson a romantic in science, and it appeared in Estonian twelve years before it appeared in Russian."],
 facts:[
 {s:"ok",t:"Lotman's archive holds his correspondence with Jakobson, alongside letters from Sebeok and from Estonian intellectuals such as Ariste, Masing, Meri and Kross.",r:["pt2016"]},
 {s:"ok",t:"For the 1973 ‘Theses on the Semiotic Study of Cultures’ Lotman wanted Jakobson as a co-author with Ivanov, Toporov, Pjatigorskij and Uspenskij. It is not clear that the invitation reached him.",r:["tsl13","lecture"]},
 {s:"ok",t:"The Theses were written for the 7th International Congress of Slavists in Warsaw in 1973, which Jakobson attended.",r:["kull2014"]},
 {s:"ok",t:"‘Mõni sõna Roman Jakobsonist’ appeared in Keel ja Kirjandus 4/1983, pp. 188–190. The commission came in autumn 1982. The Russian text was first printed in 1995.",r:["kk1983","jlart","ps2022","avtonomova"]},
 {s:"ok",t:"In the obituary Lotman says he last met Jakobson in Moscow about two years earlier and found him intellectually undiminished.",r:["lotmanru"]},
 {s:"ok",t:"Pilshchikov notes that the only Russian-language obituary of Jakobson came out in the émigré Novyj Zhurnal, and contrasts this with Estonia, where the main philological journal commissioned one.",r:["pilsh2024"]},
 {s:"ok",t:"Lotman used Jakobson's six factors and six functions as the base for the communication mechanism of the semiosphere, and Torop relates Jakobson's model to Lotman's autocommunication.",r:["andrews","torop2008","toropintro"]},
 {s:"open",t:"The Lotman–Jakobson letters have not been published as a set, as far as I could find. Pilshchikov (2024) quotes at least one unpublished letter.",r:["pilsh2024","pt2016"]}
 ],

{id:"phonology",code:"D · linguistics",title:"Estonian in Jakobson's phonology",span:"1931 onward",
 glimpse:"Estonian is a named member of the Baltic polytonic Sprachbund in Jakobson's 1931 paper. The reading of Estonian quantity as tone has been disputed by Estonian phoneticians ever since.",
 prose:["In ‘Über die phonologischen Sprachbünde’ (1931) Jakobson took Trubetzkoy's Sprachbund and redefined it by isolated phonological features shared by neighbouring, unrelated languages. His main example was the area around the Baltic, defined by polytony: Swedish, Norwegian apart from the north-western dialects, most Danish dialects, some North German dialects, North Kashubian, Lithuanian, Latvian, Livonian and Estonian.",
 "Estonian enters the list through the contrast between the second and third quantity degrees. Polivanov (1928) had described a tonal component as secondary to quantity. Trubetzkoy, in the Grundzüge (1939), and Jakobson went further and treated Estonian as having the characteristics of a tone language. Estonian phoneticians did not accept this. The modern consensus, after Lehiste, places quantity in the disyllabic foot with pitch as a secondary cue, which separates long from overlong.",
 "The companion Russian paper on the Eurasian Sprachbund puts Estonian on a boundary. Tone marks the Baltic and Pacific peripheries; consonant palatalization marks a core that roughly follows the borders of the Russian Empire."],
 facts:[
 {s:"ok",t:"Bibliography: Travaux du Cercle Linguistique de Prague 4 (1931), pp. 234–240; reprinted in Selected Writings I, pp. 137–143. English translation 1972.",r:["sw1","ophen"]},
 {s:"ok",t:"Membership of the Baltic Sprachbund as restated in current Finnic phonetics.",r:["balodis","iosad"]},
 {s:"ok",t:"Jakobson was probably the first to study the areal distribution of lexical pitch. Overlength, a related areal trait, is shared by Estonian, Livonian, Latvian and Low German.",r:["serzant"]},
 {s:"ok",t:"Lineage Polivanov → Trubetzkoy and Jakobson for the tonal reading of Estonian.",r:["icphs2007"]},
 {s:"ok",t:"Estonian linguists, above all phoneticians, rejected Polivanov's four-way opposition and Trubetzkoy's theoretical interpretation (Liiv 1961).",r:["prillop"]},
 {s:"ok",t:"Jakobson and Ilse Lehiste are named as authors of the best-known presentations of the Baltic prosodic area.",r:["wiik"]},
 {s:"ok",t:"Criticism: the Baltic Sprachbund rests on one trait, and the diachronic links between the eastern and western shores are weak.",r:["campbell","iosad"]},
 {s:"ok",t:"Eurasian Sprachbund: tone at the Baltic and Pacific peripheries, palatalization core close to the old imperial borders.",r:["friedman","schaller"]},
 {s:"open",t:"Citation trap: several recent papers give the 1931 article as TCLP 4, pp. 164–183. The reprint and the standard bibliographies give 234–240. The 164–183 span appears to belong to another Jakobson paper in the same volume.",r:["balodis","schaller","sw1"]}
 ],
 src:["sw1","ophen","balodis","serzant","icphs2007","prillop","wiik","iosad","campbell","friedman","schaller"]},

{id:"translations",code:"E · texts",title:"Jakobson in Estonian",span:"2010–2014",
 glimpse:"Five texts are verifiably available in Estonian: ‘Linguistics and Poetics’, ‘On Linguistic Aspects of Translation’, and three formalist-period essays. All were translated after 2010.",
 prose:["Jakobson reached Estonian readers late. Through the Soviet decades he was read in Russian, English and German, and the Tartu school itself published in Russian. The first translations appeared only in 2010 and 2012, both from within Tartu semiotics and literary studies, and a 2014 Tallinn anthology of Russian formalism added three earlier essays.",
 "The 1960 lecture is the text that matters most in Estonian usage. The Lopp and Merilai translation is now the standard reference in Estonian poetics and is cited in Keel ja Kirjandus, Methis and student theses. It is freely available as a PDF."],
 facts:[
 {s:"ok",t:"‘Tõlkimise keelelistest aspektidest’ (1959), tr. Elin Sütiste. Acta Semiotica Estica VII (2010), pp. 299–306. No open full text found; extracts are on Estonian Wikiquote.",r:["wq"]},
 {s:"ok",t:"‘Lingvistika ja poeetika’ (1960), tr. Neeme Lopp and Arne Merilai. Akadeemia 24(10), 2012, pp. 1731–1773. Open PDF.",r:["akad","lp_digar","lp_ut"]},
 {s:"ok",t:"‘Realismist kunstis’ (1921), tr. Märt Väljataga. In Kirjandus kui selline (2014), from p. 36.",r:["kks","gh"]},
 {s:"ok",t:"‘Kirjanduse ja keele uurimise probleemid’ (1928), with Juri Tynjanov, tr. Märt Väljataga. Same anthology, from p. 237. A 2012 printing of this translation is cited in Keel ja Kirjandus.",r:["kks","valjataga"]},
 {s:"ok",t:"‘Dominant’ (1935), tr. Märt Väljataga. Same anthology, from p. 240.",r:["kks"]},
 {s:"ok",t:"Lotman's obituary of Jakobson is itself an Estonian-language text about him, published in translation from Lotman's Russian manuscript in 1983.",r:["kk1983"]},
 {s:"open",t:"A BA thesis cites ‘Roman Jakobson. Keel, luule, kultuur’ (ed. and tr. Katre Talviste, Tartu 2012, pp. 1–43). I found no catalogue record or publisher listing. The page span matches the standalone PDF of the Akadeemia translation, so this looks like a citation error.",r:["thesis","lp_ut"]},
 {s:"open",t:"No Estonian edition of a Jakobson book or a volume of selected writings was found.",r:[]}
 ],

{id:"reception",code:"F · reception",title:"Estonian scholarship and coverage",span:"1966–2026",
 glimpse:"Estonian writing on Jakobson runs from a 1966 newspaper report to a 2021 Tartu volume and a national linguistics conference dedicated to him on 12–13 November 2026.",
 prose:["Three strands can be told apart. The first is historical: reports on the 1966 school, Lotman's obituary, and the research on Jakobson's visits and on his place in the prehistory of the Tartu school. The second is translation semiotics, where Torop and Sütiste have made Jakobson's 1959 typology a working tool and have studied how narrowly he is usually read. The third is poetics, where Arne Merilai's pragmapoetics starts from the poetic function and has carried Jakobson's model into school textbooks.",
 "The newest item is institutional. The second Estonian Linguistics Days, held at Tallinn University on 12 and 13 November 2026, are dedicated to Jakobson, with plenary lectures by Merilai and by the phonetician Einar Meister. The announcement gives no reason for the dedication; 2026 is the 130th anniversary of his birth."],
 facts:[
 {s:"ok",t:"Contemporary Estonian press and journal coverage of Jakobson at Kääriku: Ernits in Sirp ja Vasar, 9 September 1966; Remmel in Keel ja Kirjandus 1/1967.",r:["ernits","remmel"]},
 {s:"ok",t:"Taras Boyko, ‘Roman Jakobson and Estonia’, the only dedicated study, in a Tartu volume that grew out of Elin Sütiste's graduate course.",r:["boyko","rrj","rrjnote"]},
 {s:"ok",t:"Sign Systems Studies 36(2), 2008: a special issue on translation and semiotics in which nearly all papers re-read Jakobson.",r:["toropintro","sutiste2008","torop2008"]},
 {s:"ok",t:"Sütiste's finding: more than two thirds of Jakobson's reception in reference works rests on two articles out of a legacy of close to 700.",r:["sutiste2008"]},
 {s:"ok",t:"Estonian-language work on Jakobson's translation typology in Keel ja Kirjandus.",r:["ts2007"]},
 {s:"ok",t:"Merilai's line: ‘Poeetika on geenides’ (2021) extends the six functions to genetics; Methis 29 (2022) applies the poetic function to Kaplinski and Rummo; the gymnasium textbook teaches the model.",r:["geenid","methis","textbook"]},
 {s:"ok",t:"Cultural press: Sirp on the formalist anthology and the dominant; Väljataga's ‘Mis on luule?’ essays in Keel ja Kirjandus.",r:["repliik","valjataga"]},
 {s:"ok",t:"Eesti keeleteaduse päevad, Tallinn University, 12–13 November 2026, dedicated to Roman Jakobson. A Sirp essay published this week responds to the dedication.",r:["ekp","ekphome","sirp2026"]},
 {s:"ok",t:"Informal but substantial: a Tartu semiotics blog with years of Estonian and English reading notes on Jakobson.",r:["ekskursioon","rrjblog","lecture"]}
 ],

{id:"people",code:"G · networks",title:"People and archives",span:"1920–1998",
 glimpse:"The connections ran through a small number of people: Ivanov, Černov, Issakov, Bogatyrev, Sebeok. Some links often assumed, to Ariste, Oinas and Lehiste, are not documented here.",
 prose:["Read through its intermediaries, the Estonian story is short. Ivanov obtained the permit in 1966. Černov, who had made the founding trip to Moscow as a third-year student in 1963, escorted Jakobson on the train. Issakov co-organised and later wrote the memoir. Bogatyrev, Jakobson's companion from the Moscow Linguistic Circle, shared the fireside evening.",
 "Thomas Sebeok is the second channel. A Finno-Ugrist trained in Jakobson's circle, he reached Tartu in August 1970, with Černov interpreting between him and Lotman, and later wrote ‘The Estonian connection’ about it.",
 "I have marked three further links as open. They are plausible and are sometimes stated as fact, but nothing I read documents direct contact with Jakobson."],

 {s:"ok",t:"Vyacheslav Ivanov: travelled to Kääriku with Jakobson and had worked several Moscow offices to obtain the permit.",r:["salupere","vikerkaar"]},
 {s:"ok",t:"Igor Černov: escort in 1966; interpreter between Lotman and Sebeok in 1970; later founder of the Department of Semiotics.",r:["school2","cernov"]},
 {s:"ok",t:"Sergei Issakov: co-organiser in 1966 and author of the 1993 Sirp memoir on which most anecdotes rest.",r:["school2"]},
 {s:"ok",t:"Thomas A. Sebeok: visit to Tartu in August 1970 and his memoir of it.",r:["sebeok","sss26","cernov"]},
 {s:"ok",t:"Boris Uspenskij names friendship with Jakobson and with Lotman as formative.",r:["uspenskij"]},
 {s:"ok",t:"Archives: Lotman's papers (Tartu University Library and Tallinn University) hold the Jakobson letters; Jakobson's papers are at MIT.",r:["pt2016","mit"]},
 {s:"open",t:"Paul Ariste. Documented: Lotman's remark about Ariste's envy in 1966, and Trubetzkoy's use of Estonian quantity data. Not documented here: any meeting or correspondence between Ariste and Jakobson.",r:["salupere","prillop","mit"]},
 {s:"open",t:"Felix Oinas (Indiana). A Slavist and folklorist in Jakobson's fields. I found no source for personal collaboration.",r:["mit"]},
 {s:"open",t:"Ilse Lehiste. Her work on Baltic polytonicity answers Jakobson's 1931 paper. Personal contact is not documented here.",r:["wiik","serzant","mit"]}

  return `<article class="slip" id="src-${id}">
    <div class="hd"><span class="id">${num(id)}</span><span class="tag kind${s.k==="paid"?" paid":""}">${k[0]}</span><span class="tag">${LANG[s.l]}</span><span class="tag">${esc(s.y)}</span></div>

  </article>`;
}

view.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]");
  if(j){ e.preventDefault(); const t=document.getElementById(j.dataset.jump); if(t) t.scrollIntoView({block:"start"}); return; }
  const b=e.target.closest("[data-ref]"); if(!b) return;
  const el=document.getElementById("src-"+b.dataset.ref); if(!el) return;
  document.querySelectorAll(".slip.hit").forEach(x=>x.classList.remove("hit"));
  el.classList.add("hit"); el.scrollIntoView({block:"center"});
});
